# spring configuration
spring:
  application:
    name: mysite

  # Whether bean definition overriding
  main:
    allow-bean-definition-overriding: true

  # devtools - restart, live reload
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  # aop
  aop:
    auto: true
    proxy-target-class: true

  # mvc
  mvc:
    static-path-pattern: /assets/**

  #thymeleaf
  thymeleaf:
    check-template-location: true
    mode: HTML
    prefix: classpath:templates/
    suffix: .html
    encoding: UTF-8
    cache: false

  # web
  web:
    resources:
      static-locations: [file:/Users/kickscar/mysite-uploads, classpath:/assets/]

  # message resources(i18n)
  messages:
    basename: messages/message
    encoding: utf-8
    always-use-message-format: true

  servlet:
    # multipart(file upload)
    multipart:
      enabled: true
      file-size-threshold: 5242880
      max-file-size: 10485760
      max-request-size: 104857600

  # datasource
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://192.168.66.4:3306/webdb?charset=utf8
    username: webdb
    password: webdb
    hikari:
      minimum-idle: 10
      maximum-pool-size: 20

# mybatis
mybatis:
  config-location: classpath:mybatis/configuration.xml

# server configuration
server:
  port: 8080
  servlet:
    context-path: /
  error:
    whitelabel:
        enabled: false
    path: /error

# logging
logging:
  config: classpath:logback.xml